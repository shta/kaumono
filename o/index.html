<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>買うものメモで開く</title>
  <meta name="description" content="共有されたリストを、買うものメモアプリで開きます。">

  <meta property="og:title" content="買うものメモでリストを開く">
  <meta property="og:description" content="共有されたリストを、買うものメモアプリで開きます。">
  <meta property="og:image" content="https://shta.github.io/kaumono/assets/ogp.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      background: #f6f7f9;
      color: #1d1d1f;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 14px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #0a84ff;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }
    button:disabled {
      opacity: .45;
    }
    .note {
      margin-top: 18px;
      color: #666;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>買うものメモで開く</h1>
      <p id="description">共有された買い物リストをアプリで開けます。</p>

      <button id="open-app">買うものメモで開く</button>

      <p class="note">
        アプリが開かない場合は、このリンクではなく共有メッセージ本文全体をコピーして、
        アプリ内の「＋」→「共有テキストから取り込む」から貼り付けてください。
      </p>

      <p id="message" class="note"></p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const payload = params.get("p2") || "";

    const openButton = document.getElementById("open-app");
    const message = document.getElementById("message");
    const description = document.getElementById("description");

    if (!payload) {
      description.textContent = "共有データを読み取れませんでした。";
      openButton.disabled = true;
      message.textContent = "メッセージ全体をコピーして、アプリ内の取り込み画面から貼り付けてください。";
    } else {
      message.textContent = "アプリが開かない場合は、共有メッセージ本文全体をコピーして取り込んでください。";
    }

    openButton.addEventListener("click", () => {
      if (!payload) return;
      location.href = "kaumonomemo://import?p2=" + encodeURIComponent(payload);
      setTimeout(() => {
        message.textContent = "アプリが開かない場合は、買うものメモを最新版に更新するか、"
          + "共有メッセージ本文全体をコピーして取り込んでください。";
      }, 1200);
    });
  </script>
</body>
</html>
